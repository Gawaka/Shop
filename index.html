<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Shop</title>
</head>

<body>
    <header>
        <h1>Магазин</h1>
    <form class="search_form" action="">
        <select>
            <option value="усі">усі категорії</option>
        </select>
        <input id="search_inp"  type="text" placeholder="Пошук товарів..." />
        <button id="search_btn">Пошук</button>
    </form>
    <form class="sort_form" action="">
        <label for="inp1">
            В наявності
            <input id="inp1" type="checkbox" />
        </label>
        <label for="inp2">
            Немає в наявності
            <input id="inp2" type="checkbox" />
        </label>
    </form>
    </header>
    <main>
        <b>Кошик: <span class="cart">0</span></b>
        <button class="cart__btn">Відкрити кошик</button>
        <div class="modal">
            <h3>Кошик</h3>
            <button class="close-btn">&times;</button>
            <div class="cart_btns">
                <button id="apply">Оформити замовлення</button>
                <button id="clear">Очистити кошик</button>
            </div>
            <div style="padding-top: 10px;" class="modal_out"></div>
        </div>
        <div class="out">
        </div>
        <div class="thanks_modal_wrap hidden">
            <div class="thanks_modal hidden">
                <p>Дякуємо за замовлення!</p>
            </div>
        </div>
    </main>

    <script src="./script.js" type="module"></script>
</body>

</html>
